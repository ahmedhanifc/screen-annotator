name: Release

# Tag a version (e.g. `git tag v1.0.1 && git push --tags`) to build the Windows
# installer and attach it to a GitHub Release. workflow_dispatch builds the
# installer as an artifact only (handy for testing without cutting a release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Freeze with PyInstaller
        run: pyinstaller packaging/screen-annotator.spec

      - name: Determine version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} packaging\windows\installer.iss

      # Ship unsigned for now. To sign later, add a code-signing cert as a secret
      # and uncomment (adjust the cert flags to your provider):
      # - name: Sign installer
      #   run: signtool sign /fd SHA256 /a /tr http://timestamp.digicert.com /td SHA256 dist\installer\screen-annotator-setup-${{ steps.ver.outputs.version }}.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-annotator-setup
          path: dist/installer/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          # Created as a DRAFT (visible only to repo owners) so the unsigned
          # build can be tested before it's public. Flip to false to auto-publish.
          draft: true
