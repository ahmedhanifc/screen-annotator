name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt6's bundled Qt needs these shared libs to import (even offscreen).
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          DISPLAY: ":99"
          XDG_SESSION_TYPE: x11
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
